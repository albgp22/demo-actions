  title: "HF Manager's Handbook, version 9 (June 2018)"
  publisher: IARU Región 1
  date: 2018-06
  language: en
  url:
    value: https://www.iaru-r1.org/wp-content/uploads/2019/08/hf_managers_handbook_v9.pdf
    date: '2026-10-20'
