    date: '2026-10-20'
  note: "Bandas laterales (LSB por debajo de 10 MHz, USB por encima; USB en 5 MHz), dial 3 kHz por debajo del borde superior en 20 m y superiores, uso de 7050-7060 kHz para SSB si no hay actividad digital."

verl-iaru-r1-vie19-harmonisation:
