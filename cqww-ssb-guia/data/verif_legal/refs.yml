verl-iaru-r1-hf-bandplan-2019:
  type: web
  title: "IARU Region 1 HF band plan (PDF publicado en 2019, edición anterior a la de 2020)"
  publisher: IARU Región 1
  language: en
  url:
    value: https://www.iaru-r1.org/wp-content/uploads/2019/08/hf_r1_bandplan.pdf
    date: '2026-10-20'
