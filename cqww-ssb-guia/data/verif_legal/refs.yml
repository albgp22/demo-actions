  note: "Tabla comparativa de las tres regiones; usada para 14125-14300 kHz y para las balizas de 10 m (28190-28225 kHz)."

verl-iaru-r1-dv05-plenary:
  type: report
  title: "IARU Region 1 General Conference Davos 2005: Final Plenary"
  publisher: IARU Región 1
  date: 2005
  language: en
